name: Update proxy list

on:
  schedule:
    - cron: "17 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/proxies.json
        run: python tools/refresh.py --limit 60

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proxies.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update proxies $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
